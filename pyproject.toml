[project]
name = "cadence-memory"
dynamic = ["version"]
description = "Knowledge management tool for Cadence"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.9",
    "PyYAML>=6.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
cadence-memory = "cadence_memory.cli:app"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "file"
path = "src/cadence_memory/__init__.py"

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["frontmatter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
