# cadence-memory annotations-config.yaml.
#
# Single source of truth for "what gets indexed": a markdown file under one of
# the projects from config.yaml is only picked up by `cadence-memory reindex`
# if it has an entry in this list. Files missing from here are not indexed,
# even if they physically exist.
#
# `cadence-memory discover` regenerates this file (writes
# annotations-config.yaml.proposed by default; --apply overwrites this one).
# Hand-editing is fully supported — frontmatter on the document still wins
# for `kind` and `title`, and `tags`/`related` are merged.
#
# Full reference: docs/design.md §5.2 (entry shape) and §6 (priority rules).
documents: []
