# cadence-memory project map.
#
# Hand-edited only. Lists the projects to scan, what to exclude inside them,
# and (optionally) discover rules. The list of indexed documents lives in
# annotations-config.yaml — this file just maps project names to paths.
#
# Full reference: docs/design.md §5.1.

# Project roots. Each project needs a unique `name` (matching ^[a-z0-9_-]+$)
# and a `path`; everything else is optional. Replace this empty list with
# entries for your projects, e.g.:
#
# projects:
#   - name: billing
#     path: ~/code/billing
#     exclude:
#       # Python virtual envs / installed packages
#       - "**/.venv/**"
#       - "**/venv/**"
#       - "**/env/**"
#       - "**/.pip_packages/**"
#       - "**/site-packages/**"
#       # Python caches
#       - "**/__pycache__/**"
#       - "**/.pytest_cache/**"
#       - "**/.mypy_cache/**"
#       - "**/.ruff_cache/**"
#       - "**/.tox/**"
#       - "**/.nox/**"
#       # Coverage / test artefacts
#       - "**/htmlcov/**"
#       - "**/.coverage"
#       - "**/coverage.xml"
#       # Build artefacts
#       - "**/dist/**"
#       - "**/build/**"
#       - "**/*.egg-info/**"
#       # VCS / generic
#       - "**/.git/**"
#       - "**/node_modules/**"
#     # Optional rules consumed by `cadence-memory discover`. Files matching a
#     # pattern get the listed `kind` without the skill having to guess.
#     discover:
#       kind_rules:
#         - pattern: "README.md"
#           kind: service
#         - pattern: "docs/adr/*.md"
#           kind: adr
#
#   - name: orders
#     path: ~/code/orders
#     # See the recommended exclude list above.
projects: []

# Shared documents living inside this cadence-memory directory itself
# (e.g. workflows/, glossary.md). Defaults are sensible — uncomment to override.
#
# globals:
#   include: ["**/*.md"]
#   exclude: ["ephemeral/**", "annotations-config.yaml*"]

# Defaults applied when neither annotations-config.yaml nor frontmatter sets
# the field. Only `kind` is configurable today.
defaults:
  kind: doc

# Whether to commit the SQLite index alongside the markdown sources. Default
# is false (index.sqlite is gitignored). Flip to true if you want to share a
# prebuilt index between machines.
#
# commit_index: false

# Claude model used by features that call out to Claude (e.g. enrichment).
# Individual features may override this; this is the shared default.
claude:
  default_model: claude-haiku-4-5

# Index-time enrichment: ask Claude to generate cross-lingual keywords,
# questions, and alternative phrasings for each chunk so FTS recall works
# across languages. Set `enabled: false` (or pass `--no-enrichment` to
# `reindex`) to skip the Claude calls entirely. `model: null` falls back to
# `claude.default_model`.
enrichment:
  enabled: true
  model: null

# Query-time expansion: before searching, ask Claude to generate alternative
# phrasings of the user's query (e.g. Russian technical terms → English
# equivalents) and merge per-variant FTS rankings via reciprocal rank fusion.
# Set `enabled: false` (or pass `--no-expand` to `query`) to skip the Claude
# call entirely. `model: null` falls back to `claude.default_model`.
# `max_variants` caps how many alternatives Claude is asked to produce.
#
# Query-time rerank: after FTS5 + identifier boost + RRF, hand the top-K
# candidates to Claude for relevance scoring (0–10) and re-sort the head of
# the result list. Set `enabled: false` (or pass `--no-rerank` to `query`)
# to skip the Claude call. `model: null` falls back to `claude.default_model`
# (override per call with `--rerank-model`). `top_k` caps how many chunks the
# LLM sees (override per call with `--rerank-top-k`).
#
# query:
#   expansion:
#     enabled: true
#     model: null
#     max_variants: 3
#   rerank:
#     enabled: true
#     model: null
#     top_k: 20
