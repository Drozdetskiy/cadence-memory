projects:
  - name: billing
    path: /tmp/cadence_memory_test/billing
    exclude:
      - "node_modules/**"
      - ".venv/**"
      - "**/test_*.md"
    discover:
      kind_rules:
        - pattern: "README.md"
          kind: service
        - pattern: "docs/adr/*.md"
          kind: adr

  - name: orders
    path: /tmp/cadence_memory_test/orders
    exclude:
      - "node_modules/**"
      - ".venv/**"

globals:
  include: ["**/*.md", "**/*.markdown"]
  exclude: ["ephemeral/**", "annotations-config.yaml*", "drafts/**"]

defaults:
  kind: pattern

commit_index: true
